name: Configurer Java

on:
  workflow_dispatch:

jobs:
  configurer-java:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer Java 21
        uses: actions/checkout@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Afficher la version de Java
        run: java -version

      - name: Afficher la version de Maven
        run: mvn -version
